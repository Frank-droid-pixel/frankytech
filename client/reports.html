<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — FRANKY TECH</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="toast-region" aria-live="polite"></div>
<div id="appShellRoot"></div>

<template id="pageContentTemplate">
  <div class="page-head">
    <div><h1>Reports</h1><p style="margin:0;">Every number here comes straight from your data — nothing is estimated.</p></div>
    <div class="toolbar">
      <input type="date" id="fromDate">
      <span style="color:var(--text-muted);">to</span>
      <input type="date" id="toDate">
      <button class="btn btn-primary" id="applyBtn">Apply</button>
    </div>
  </div>

  <div class="dash-grid" id="plGrid"></div>

  <div style="display:grid; grid-template-columns: 1.4fr 1fr; gap:20px; margin-top:8px;">
    <div class="dash-panel">
      <h3 style="margin-bottom:14px;">Sales by day</h3>
      <div id="salesChart"></div>
    </div>
    <div class="dash-panel">
      <h3 style="margin-bottom:14px;">Expenses by category</h3>
      <div id="expenseBreakdown"></div>
    </div>
  </div>

  <div class="dash-panel" style="margin-top:20px;">
    <h3 style="margin-bottom:14px;">Top products / services</h3>
    <div id="topProducts"></div>
  </div>

  <div class="dash-panel" style="margin-top:20px;">
    <h3 style="margin-bottom:14px;">Invoice status breakdown</h3>
    <div id="invoiceBreakdown"></div>
  </div>
</template>

<script src="/js/auth.js" defer></script>
<script src="/js/app-shell.js" defer></script>
<script src="/js/reports.js" defer></script>
</body>
</html>
