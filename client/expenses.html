<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses — FRANKY TECH</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="toast-region" aria-live="polite"></div>
<div id="appShellRoot"></div>

<template id="pageContentTemplate">
  <div class="page-head">
    <div><h1>Expenses</h1><p style="margin:0;">Track spending by category, month by month.</p></div>
    <div class="toolbar"><button class="btn btn-primary" id="addBtn">+ Add expense</button></div>
  </div>
  <div class="data-table-wrap">
    <table class="data-table">
      <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Method</th><th>Amount</th><th></th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="dash-empty" id="emptyState" style="display:none;">No expenses recorded yet.</div>
  </div>
</template>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitle">Add expense</h3><button class="modal-close" id="modalClose">&times;</button></div>
    <div class="form-alert" id="formAlert" role="alert"></div>
    <form id="expenseForm" novalidate>
      <input type="hidden" name="id">
      <div class="field">
        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="Rent">Rent</option>
          <option value="Salaries">Salaries</option>
          <option value="Transport">Transport</option>
          <option value="Electricity">Electricity</option>
          <option value="Internet">Internet</option>
          <option value="Marketing">Marketing</option>
          <option value="Equipment">Equipment</option>
          <option value="Inventory">Inventory</option>
          <option value="Maintenance">Maintenance</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label for="amount">Amount</label><input type="number" step="0.01" min="0.01" id="amount" name="amount" required><div class="error"></div></div>
        <div class="field"><label for="expenseDate">Date</label><input type="date" id="expenseDate" name="expenseDate"></div>
      </div>
      <div class="field">
        <label for="paymentMethod">Payment method</label>
        <select id="paymentMethod" name="paymentMethod">
          <option value="cash">Cash</option><option value="bank_transfer">Bank transfer</option>
          <option value="mobile_money">Mobile money</option><option value="card">Card</option><option value="other">Other</option>
        </select>
      </div>
      <div class="field"><label for="description">Description</label><input type="text" id="description" name="description"></div>
      <div class="field"><label for="notes">Notes</label><textarea id="notes" name="notes" rows="2"></textarea></div>
      <button type="submit" class="btn btn-primary btn-block" id="saveBtn"><span class="spinner"></span><span class="btn-label">Save expense</span></button>
    </form>
  </div>
</div>

<script src="/js/auth.js" defer></script>
<script src="/js/app-shell.js" defer></script>
<script src="/js/expenses.js" defer></script>
</body>
</html>
