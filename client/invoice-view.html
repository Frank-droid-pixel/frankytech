<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice — FRANKY TECH</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="toast-region" aria-live="polite"></div>
<div id="appShellRoot"></div>

<template id="pageContentTemplate">
  <div class="page-head">
    <div>
      <h1 id="invoiceTitle">Invoice</h1>
      <p style="margin:0;" id="invoiceSubtitle"></p>
    </div>
    <a class="btn btn-ghost" href="/invoices.html">← Back to invoices</a>
  </div>

  <div class="doc-actions">
    <a class="btn btn-primary" id="pdfLink" target="_blank">📄 View / Download PDF</a>
    <button class="btn btn-ghost" id="sendBtn">Mark as sent</button>
    <button class="btn btn-accent" id="recordPaymentBtn">+ Record payment</button>
    <button class="btn btn-ghost" id="cancelBtn" style="color:var(--danger); border-color:var(--danger);">Cancel invoice</button>
    <button class="btn btn-ghost" id="shareBtn">🔗 Get customer portal link</button>
    <button class="btn btn-ghost" id="waShareBtn">Share via WhatsApp</button>
  </div>

  <div class="doc-view" id="docView"></div>

  <div class="dash-panel" style="max-width:780px; margin: 24px auto 0;">
    <h3 style="margin-bottom:10px;">Payment history</h3>
    <div id="paymentsList" class="dash-empty">No payments recorded yet.</div>
  </div>
</template>

<div class="modal-overlay" id="paymentModalOverlay">
  <div class="modal-box">
    <div class="modal-head"><h3>Record payment</h3><button class="modal-close" id="paymentModalClose">&times;</button></div>
    <div class="form-alert" id="paymentAlert" role="alert"></div>
    <form id="paymentForm" novalidate>
      <p style="margin:0 0 14px;">Balance due: <strong id="balanceDisplay"></strong></p>
      <div class="field"><label for="amount">Amount</label><input type="number" step="0.01" min="0.01" id="amount" name="amount" required><div class="error"></div></div>
      <div class="field">
        <label for="method">Payment method</label>
        <select id="method" name="method">
          <option value="cash">Cash</option>
          <option value="bank_transfer">Bank transfer</option>
          <option value="mobile_money">Mobile money</option>
          <option value="card">Card</option>
          <option value="online">Online</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field"><label for="reference">Reference (optional)</label><input type="text" id="reference" name="reference"></div>
      <button type="submit" class="btn btn-primary btn-block" id="paymentSaveBtn">
        <span class="spinner"></span><span class="btn-label">Record payment</span>
      </button>
    </form>
  </div>
</div>

<script src="/js/auth.js" defer></script>
<script src="/js/app-shell.js" defer></script>
<script src="/js/invoice-view.js" defer></script>
</body>
</html>
