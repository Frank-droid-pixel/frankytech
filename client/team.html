<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team — FRANKY TECH</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="toast-region" aria-live="polite"></div>
<div id="appShellRoot"></div>

<template id="pageContentTemplate">
  <div class="page-head">
    <div><h1>Team</h1><p style="margin:0;">Invite people to help manage this business.</p></div>
    <div class="toolbar"><button class="btn btn-primary" id="inviteBtn">+ Invite member</button></div>
  </div>

  <h3 style="margin-bottom:14px;">Members</h3>
  <div class="data-table-wrap" style="margin-bottom:28px;">
    <table class="data-table">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
      <tbody id="membersBody"></tbody>
    </table>
  </div>

  <h3 style="margin-bottom:14px;">Pending invitations</h3>
  <div class="data-table-wrap">
    <table class="data-table">
      <thead><tr><th>Email</th><th>Role</th><th>Sent</th><th></th></tr></thead>
      <tbody id="invitesBody"></tbody>
    </table>
    <div class="dash-empty" id="emptyInvites" style="display:none;">No pending invitations.</div>
  </div>
</template>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head"><h3>Invite team member</h3><button class="modal-close" id="modalClose">&times;</button></div>
    <div class="form-alert" id="formAlert" role="alert"></div>
    <form id="inviteForm" novalidate>
      <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" required></div>
      <div class="field">
        <label for="role">Role</label>
        <select id="role" name="role">
          <option value="staff">Staff</option>
          <option value="sales">Sales</option>
          <option value="accountant">Accountant</option>
          <option value="manager">Manager</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="saveBtn"><span class="spinner"></span><span class="btn-label">Send invitation</span></button>
    </form>
  </div>
</div>

<script src="/js/auth.js" defer></script>
<script src="/js/app-shell.js" defer></script>
<script src="/js/team.js" defer></script>
</body>
</html>
