<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Quotation — FRANKY TECH</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="toast-region" aria-live="polite"></div>
<div id="appShellRoot"></div>

<template id="pageContentTemplate">
  <div class="page-head">
    <div><h1>New Quotation</h1><p style="margin:0;">Send a quote your customer can accept online.</p></div>
    <a class="btn btn-ghost" href="/quotations.html">Cancel</a>
  </div>
  <div class="form-alert" id="formAlert" role="alert"></div>
  <div class="dash-panel" style="max-width: 900px;">
    <form id="quotationForm" novalidate>
      <div class="field-row">
        <div class="field"><label for="customerId">Customer</label><select id="customerId" name="customerId" required></select><div class="error"></div></div>
        <div class="field"><label for="validUntil">Valid until</label><input type="date" id="validUntil" name="validUntil"></div>
      </div>
      <h3 style="margin-top:24px;">Line items</h3>
      <div class="builder-lines" id="builderLines"></div>
      <button type="button" class="btn btn-ghost" id="addLineBtn">+ Add line</button>
      <div class="field-row" style="margin-top:24px;">
        <div class="field"><label for="discountType">Discount type</label>
          <select id="discountType" name="discountType"><option value="fixed">Fixed amount</option><option value="percent">Percentage</option></select>
        </div>
        <div class="field"><label for="discountValue">Discount value</label><input type="number" step="0.01" min="0" id="discountValue" name="discountValue" value="0"></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="shippingAmount">Shipping</label><input type="number" step="0.01" min="0" id="shippingAmount" name="shippingAmount" value="0"></div>
        <div class="field"><label for="labourAmount">Labour</label><input type="number" step="0.01" min="0" id="labourAmount" name="labourAmount" value="0"></div>
      </div>
      <div class="field"><label for="notes">Notes</label><textarea id="notes" name="notes" rows="2"></textarea></div>
      <div class="field"><label for="terms">Terms</label><textarea id="terms" name="terms" rows="2"></textarea></div>
      <div class="builder-totals" id="builderTotals"></div>
      <button type="submit" class="btn btn-primary btn-lg" id="saveBtn" style="margin-top:16px;">
        <span class="spinner"></span><span class="btn-label">Create quotation</span>
      </button>
    </form>
  </div>
</template>

<script src="/js/auth.js" defer></script>
<script src="/js/app-shell.js" defer></script>
<script src="/js/document-builder.js" defer></script>
<script src="/js/quotation-new.js" defer></script>
</body>
</html>
