<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotation — FRANKY TECH</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="toast-region" aria-live="polite"></div>
<div id="appShellRoot"></div>

<template id="pageContentTemplate">
  <div class="page-head">
    <div><h1 id="quoteTitle">Quotation</h1><p style="margin:0;" id="quoteSubtitle"></p></div>
    <a class="btn btn-ghost" href="/quotations.html">← Back to quotations</a>
  </div>
  <div class="doc-actions">
    <a class="btn btn-primary" id="pdfLink" target="_blank">📄 View / Download PDF</a>
    <button class="btn btn-ghost" id="sendBtn">Mark as sent</button>
    <button class="btn btn-ghost" id="acceptBtn" style="color:var(--success); border-color:var(--success);">Mark accepted</button>
    <button class="btn btn-ghost" id="rejectBtn" style="color:var(--danger); border-color:var(--danger);">Mark rejected</button>
    <button class="btn btn-accent" id="convertBtn">Convert to invoice</button>
    <button class="btn btn-ghost" id="shareBtn">🔗 Get customer portal link</button>
    <button class="btn btn-ghost" id="waShareBtn">Share via WhatsApp</button>
  </div>
  <div class="doc-view" id="docView"></div>
</template>

<script src="/js/auth.js" defer></script>
<script src="/js/app-shell.js" defer></script>
<script src="/js/quotation-view.js" defer></script>
</body>
</html>
