<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin: Announcements — FRANKY TECH</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="toast-region" aria-live="polite"></div>
<div id="appShellRoot"></div>
<template id="pageContentTemplate">
  <div class="page-head">
    <div><h1>Announcements</h1><p style="margin:0;">System-wide messages.</p></div>
    <div class="toolbar"><button class="btn btn-primary" id="newBtn">+ New announcement</button></div>
  </div>
  <div id="list"></div>
</template>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head"><h3>New announcement</h3><button class="modal-close" id="modalClose">&times;</button></div>
    <form id="form" novalidate>
      <div class="field"><label for="title">Title</label><input type="text" id="title" name="title" required></div>
      <div class="field"><label for="body">Message</label><textarea id="body" name="body" rows="3" required></textarea></div>
      <button type="submit" class="btn btn-primary btn-block" id="saveBtn"><span class="spinner"></span><span class="btn-label">Publish</span></button>
    </form>
  </div>
</div>
<script src="/js/auth.js" defer></script>
<script src="/js/admin-shell.js" defer></script>
<script src="/js/admin-announcements.js" defer></script>
</body>
</html>
