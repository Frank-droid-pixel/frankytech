<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Referrals — FRANKY TECH</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="toast-region" aria-live="polite"></div>
<div id="appShellRoot"></div>

<template id="pageContentTemplate">
  <div class="page-head">
    <div><h1>Referrals</h1><p style="margin:0;">Invite other businesses to FRANKY TECH and earn rewards.</p></div>
  </div>

  <div class="dash-panel" style="margin-bottom:24px;">
    <div style="font-size:var(--caption); color:var(--text-muted); margin-bottom:6px;">MY REFERRAL LINK</div>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <code class="mono" id="referralUrl" style="background:var(--surface-secondary); padding:10px 14px; border-radius:var(--radius-sm); font-size:var(--small); word-break:break-all;"></code>
      <button class="btn btn-primary" id="copyBtn">Copy link</button>
      <button class="btn btn-ghost" id="waBtn">Share via WhatsApp</button>
    </div>
  </div>

  <div class="dash-grid" id="statsGrid"></div>

  <div class="dash-panel">
    <h3 style="margin-bottom:14px;">Referral history</h3>
    <div id="historyList"></div>
    <div class="dash-empty" id="emptyState" style="display:none;">No referrals yet — share your link to get started.</div>
  </div>
</template>

<script src="/js/auth.js" defer></script>
<script src="/js/app-shell.js" defer></script>
<script src="/js/referrals.js" defer></script>
</body>
</html>
