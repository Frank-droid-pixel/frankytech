<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — FRANKY TECH</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="toast-region" aria-live="polite"></div>

<div class="auth-shell">
  <aside class="auth-side">
    <div class="brand">
      <img src="/assets/logo/icon.png" width="34" height="34" alt="">
      <span class="w">FRANKY<span> TECH</span></span>
    </div>
    <div>
      <h2>Run your business on one powerful platform.</h2>
      <p>Invoicing, customers, inventory, payments, reviews and referrals — set up in minutes.</p>
    </div>
    <span class="foot">Build. Manage. Grow.</span>
  </aside>

  <div class="auth-main">
    <div class="auth-card">
      <a href="/" class="top-link">
        <img src="/assets/logo/icon.png" width="34" height="34" alt="">
        <span class="w">FRANKY<span> TECH</span></span>
      </a>
      <h1>Create your account</h1>
      <p class="sub">Start free. Upgrade only when you need to.</p>

      <div class="form-alert" id="formAlert" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" name="fullName" autocomplete="name" required>
          <div class="error"></div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <div class="error"></div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel">
            <div class="error"></div>
          </div>
          <div class="field">
            <label for="country">Country</label>
            <input type="text" id="country" name="country" autocomplete="country-name">
            <div class="error"></div>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
          <div class="error"></div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required minlength="8">
          <div class="error"></div>
        </div>

        <div class="field">
          <label for="referralCode">Referral code <span style="font-weight:400; color:var(--text-muted);">(optional)</span></label>
          <input type="text" id="referralCode" name="referralCode" placeholder="e.g. FRANK1A2B3C">
          <div class="error"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
          <span class="spinner"></span>
          <span class="btn-label">Create account</span>
        </button>
      </form>

      <p class="switch">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </div>
</div>

<script src="/js/auth.js" defer></script>
<script src="/js/register.js" defer></script>
</body>
</html>
