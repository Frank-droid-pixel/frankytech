<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products & Services — FRANKY TECH</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="toast-region" aria-live="polite"></div>
<div id="appShellRoot"></div>

<template id="pageContentTemplate">
  <div class="page-head">
    <div>
      <h1>Products & Services</h1>
      <p style="margin:0;">Everything you sell — with stock tracked automatically as you invoice.</p>
    </div>
    <div class="toolbar">
      <select id="typeFilter">
        <option value="">All types</option>
        <option value="product">Products</option>
        <option value="service">Services</option>
      </select>
      <input type="search" id="searchInput" placeholder="Search…">
      <button class="btn btn-primary" id="addBtn">+ Add item</button>
    </div>
  </div>

  <div id="lowStockBanner" class="form-alert" style="display:none; background:color-mix(in srgb, var(--accent) 12%, var(--surface)); border-color: var(--accent); color: var(--accent-dark);"></div>

  <div class="data-table-wrap">
    <table class="data-table">
      <thead>
        <tr><th>Name</th><th>Type</th><th>SKU</th><th>Price</th><th>Stock</th><th></th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="dash-empty" id="emptyState" style="display:none;">No products or services yet — add your first one.</div>
  </div>
</template>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Add item</h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="form-alert" id="formAlert" role="alert"></div>
    <form id="itemForm" novalidate>
      <input type="hidden" name="id">
      <div class="field">
        <label for="type">Type</label>
        <select id="type" name="type">
          <option value="product">Product (tracks stock)</option>
          <option value="service">Service (no stock)</option>
        </select>
      </div>
      <div class="field"><label for="name">Name</label><input type="text" id="name" name="name" required><div class="error"></div></div>
      <div class="field-row">
        <div class="field"><label for="sku">SKU</label><input type="text" id="sku" name="sku"></div>
        <div class="field"><label for="category">Category</label><input type="text" id="category" name="category"></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="cost">Cost price</label><input type="number" step="0.01" min="0" id="cost" name="cost" value="0"></div>
        <div class="field"><label for="price">Selling price</label><input type="number" step="0.01" min="0" id="price" name="price" value="0" required><div class="error"></div></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="taxRate">Tax rate (%)</label><input type="number" step="0.01" min="0" id="taxRate" name="taxRate" value="0"></div>
        <div class="field"><label for="unit">Unit</label><input type="text" id="unit" name="unit" value="unit"></div>
      </div>
      <div class="field-row" id="stockFields">
        <div class="field"><label for="quantity">Starting stock</label><input type="number" step="0.01" min="0" id="quantity" name="quantity" value="0"></div>
        <div class="field"><label for="minStock">Low-stock alert at</label><input type="number" step="0.01" min="0" id="minStock" name="minStock" value="0"></div>
      </div>
      <div class="field"><label for="description">Description</label><textarea id="description" name="description" rows="2"></textarea></div>
      <button type="submit" class="btn btn-primary btn-block" id="saveBtn">
        <span class="spinner"></span><span class="btn-label">Save item</span>
      </button>
    </form>
  </div>
</div>

<div class="modal-overlay" id="stockModalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Adjust stock — <span id="stockItemName"></span></h3>
      <button class="modal-close" id="stockModalClose">&times;</button>
    </div>
    <div class="form-alert" id="stockAlert" role="alert"></div>
    <form id="stockForm" novalidate>
      <p style="margin:0 0 14px;">Current stock: <strong id="stockCurrent">0</strong></p>
      <div class="field">
        <label for="quantityDelta">Adjustment (use a negative number to remove stock)</label>
        <input type="number" step="0.01" id="quantityDelta" name="quantityDelta" required>
      </div>
      <div class="field"><label for="stockNote">Reason</label><input type="text" id="stockNote" name="note" placeholder="e.g. Stock delivery, damaged goods"></div>
      <button type="submit" class="btn btn-primary btn-block" id="stockSaveBtn">
        <span class="spinner"></span><span class="btn-label">Apply adjustment</span>
      </button>
    </form>
  </div>
</div>

<script src="/js/auth.js" defer></script>
<script src="/js/app-shell.js" defer></script>
<script src="/js/products.js" defer></script>
</body>
</html>
